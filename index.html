<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sma Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main: #ffb6c1; --bg: #0a0a0a; --card: #141414; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 15px; padding-bottom: 100px; margin:0; }
        .tab { display: none; } .active { display: block; }
        .header-title { text-align: center; color: var(--main); font-weight: 900; margin-bottom: 20px; font-size: 24px; }
        .cat-card { background: var(--card); padding: 25px; border-radius: 15px; margin-bottom: 12px; text-align: center; border: 1px solid #222; font-size: 18px; font-weight: 800; color: var(--main); }
        .card { background: var(--card); border: 1px solid #1f1f1f; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: var(--main); color: #000; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 800; font-size: 15px; margin-top: 8px; }
        .btn-small { background: var(--main); color: #000; padding: 6px 12px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0f0f; display: flex; justify-content: space-around; padding: 20px 0; border-top: 1px solid #222; }
        .nav-item { color: #555; cursor: pointer; font-weight: 900; font-size: 14px; } .active-nav { color: var(--main); }
        input, textarea, select { width: 100%; padding: 12px; margin: 6px 0; background: #111; color: #fff; border: 1px solid #222; border-radius: 8px; box-sizing: border-box; }
        .admin-section { background:#111; padding:12px; border-radius:12px; margin-top:10px; border: 1px solid #222; }
        h3 { font-size: 13px; color: var(--main); margin: 5px 0; }
    </style>
</head>
<body>

<div id="store-tab" class="tab active">
    <div class="header-title" id="welcome-msg">SMA MARKET</div>
    <div id="cat-menu">
        <div class="cat-card" onclick="showCat('3C/L')">3C/L</div>
        <div class="cat-card" onclick="showCat('4CC/LL')">4CC/LL</div>
        <div class="cat-card" onclick="showCat('Double/Triple')">Double/Triple</div>
        <div class="cat-card" onclick="showCat('4C/L Same')">4C/L Same</div>
        <div class="cat-card" onclick="showCat('4C/L')">4C/L</div>
        <div class="cat-card" onclick="showCat('Others')">Others</div>
    </div>
    <div id="items-view" style="display:none">
        <button class="btn-small" onclick="backToCats()" style="margin-bottom:10px">BACK</button>
        <div id="items-list"></div>
    </div>
</div>

<div id="admin-tab" class="tab">
    <div class="header-title">ADMIN PANEL</div>
    <div class="admin-section">
        <h3>Target Category</h3>
        <select id="target-cat">
            <option value="3C/L">3C/L</option>
            <option value="4CC/LL">4CC/LL</option>
            <option value="Double/Triple">Double/Triple</option>
            <option value="4C/L Same">4C/L Same</option>
            <option value="4C/L">4C/L</option>
            <option value="Others">Others</option>
        </select>
        <h3>Data (user:pass:email:price)</h3>
        <textarea id="admin-in" rows="5" placeholder="Use any separator like : or / or |"></textarea>
        <button class="btn" onclick="addWithCat()">ADD ACCOUNTS</button>
    </div>
</div>

<nav class="nav">
    <div class="nav-item active-nav" onclick="tab('store-tab', this)">STORE</div>
    <div id="admin-btn" class="nav-item" style="display:none" onclick="tab('admin-tab', this)">ADMIN</div>
</nav>

<script>
    const tg = window.Telegram.WebApp;
    const API = "https://laquita-unperturbed-altagracia.ngrok-free.dev/sma"; 
    const ADMIN_IDS = [5859388511, 6920293690];
    let allI = [];

    // الترحيب المخصص
    const firstName = tg.initDataUnsafe.user?.first_name || "Guest";
    document.getElementById('welcome-msg').innerText = `Welcome ${firstName} to SMA Market`;

    if(ADMIN_IDS.includes(tg.initDataUnsafe.user?.id)) document.getElementById('admin-btn').style.display='block';

    function tab(id, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        el.classList.add('active-nav');
    }

    async function load() {
        const r = await fetch(`${API}/get_all`, { headers: { "ngrok-skip-browser-warning": "1" } });
        const d = await r.json();
        allI = d.items;
    }

    async function addWithCat() {
        const cat = document.getElementById('target-cat').value;
        const content = document.getElementById('admin-in').value;
        if(!content) return;
        
        await fetch(`${API}/admin/manage`, {
            method:'POST',
            headers:{'Content-Type':'application/json', 'ngrok-skip-browser-warning':'1'},
            body:JSON.stringify({
                user_id: tg.initDataUnsafe.user.id,
                action: 'add_users',
                cat: cat, // نرسل القسم المختار
                content: content
            })
        });
        tg.showAlert(`Added to ${cat} successfully`);
        document.getElementById('admin-in').value = "";
        load();
    }

    function showCat(c) {
        document.getElementById('cat-menu').style.display='none';
        document.getElementById('items-view').style.display='block';
        const filtered = allI.filter(i => i.c == c);
        document.getElementById('items-list').innerHTML = filtered.length === 0 ? '<p style="text-align:center;">EMPTY</p>' : filtered.map(i => `
            <div class="card">
                <div><b>@${i.u}</b><br><small>$${i.p}</small></div>
                <button class="btn-small">ADD</button>
            </div>`).join('');
    }
    
    function backToCats() { document.getElementById('cat-menu').style.display='block'; document.getElementById('items-view').style.display='none'; }
    tg.expand(); load();
</script>
</body>
</html>
