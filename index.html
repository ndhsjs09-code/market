<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sma Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #ff2d75; --bg: #0a0a0a; --card-bg: #161616; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 15px; }
        .card { background: var(--card-bg); border: 1px solid #222; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: var(--primary); color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; }
        .btn-del { background: #ff4444; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .tab { display: none; } .active { display: block; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .active-nav { color: var(--primary); }
    </style>
</head>
<body>

<div id="store-tab" class="tab active">
    <h2 style="color:var(--primary); text-align:center;">Store</h2>
    <div id="items-container"></div>
</div>

<div id="admin-tab" class="tab">
    <h2 style="color:var(--primary); text-align:center;">Admin Panel</h2>
    <div id="adm-items-list"></div>
</div>

<nav class="nav">
    <div class="nav-item active-nav" onclick="switchTab('store-tab', this)">STORE</div>
    <div id="admin-nav-btn" class="nav-item" style="display:none" onclick="switchTab('admin-tab', this)">ADMIN</div>
</nav>

<script>
    const tg = window.Telegram.WebApp;
    const API = "https://laquita-unperturbed-altagracia.ngrok-free.dev/sma";
    let allItems = [];

    // إظهار تبويب الأدمن فقط للمسؤولين
    if([5939498558].includes(tg.initDataUnsafe.user?.id)) document.getElementById("admin-nav-btn").style.display = "block";

    async function loadData() {
        const res = await fetch(`${API}/get_all`);
        const data = await res.json();
        allItems = data.items || [];
        renderStore();
        renderAdmin();
    }

    // عرض المتجر مع زر ADD
    function renderStore() {
        document.getElementById("items-container").innerHTML = allItems.map(i => `
            <div class="card">
                <div><strong>@${i.u}</strong><br><small style="color:#666">${i.c}</small></div>
                <button class="btn-add" onclick="tg.showAlert('تمت الإضافة: ${i.u}')">ADD</button>
            </div>`).join("");
    }

    // عرض الأدمن مع زر حذف
    function renderAdmin() {
        document.getElementById("adm-items-list").innerHTML = allItems.map(i => `
            <div class="card">
                <span>@${i.u}</span>
                <button class="btn-del" onclick="adminAction('del_user', '${i.u}')">Del</button>
            </div>`).join("");
    }

    async function adminAction(action, val) {
        await fetch(`${API}/admin/manage`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ action, content: val })
        });
        loadData();
    }

    function switchTab(t, el) {
        document.querySelectorAll('.tab').forEach(x => x.style.display = 'none');
        document.getElementById(t).style.display = 'block';
        document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active-nav'));
        el.classList.add('active-nav');
    }

    tg.expand();
    loadData();
</script>
</body>
</html>
