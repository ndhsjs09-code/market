<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sma Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main: #ffb6c1; --bg: #0a0a0a; --card: #141414; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; padding: 15px; margin:0; padding-bottom: 100px; }
        .tab { display: none; } .active { display: block; }
        .header-title { text-align: center; color: var(--main); font-weight: 900; margin-bottom: 20px; font-size: 22px; }
        .cat-card { background: var(--card); padding: 18px; border-radius: 10px; margin-bottom: 8px; text-align: center; border: 1px solid #222; color: var(--main); font-weight: bold; cursor: pointer; }
        .card { background: var(--card); border: 1px solid #1f1f1f; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; }
        .btn { background: var(--main); color: #000; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-small { background: var(--main); color: #000; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; border: none; }
        .btn-small:disabled { background: #333; color: #777; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0f0f; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { color: #555; cursor: pointer; font-weight: 900; } .active-nav { color: var(--main); }
        input, textarea, select { width: 100%; padding: 12px; margin: 6px 0; background: #111; color: #fff; border: 1px solid #222; border-radius: 6px; box-sizing: border-box; text-align: center; }
        .admin-sec { background: #111; padding: 12px; border-radius: 10px; margin-top: 15px; border: 1px solid #333; }
        .copy-box { background: #000; padding: 12px; border: 1px dashed var(--main); margin: 10px 0; border-radius: 6px; cursor: pointer; color: var(--main); font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div id="store-tab" class="tab active">
    <div class="header-title">SMA MARKET</div>
    <div id="cat-menu">
        <div class="cat-card" onclick="showCat('3c/L')">3c / L</div>
        <div class="cat-card" onclick="showCat('4LL/CC')">4LL / CC</div>
        <div class="cat-card" onclick="showCat('4C/L Same')">4C / L Same</div>
        <div class="cat-card" onclick="showCat('4C/L')">4C / L</div>
        <div class="cat-card" onclick="showCat('Double/Triple')">Double / Triple</div>
    </div>
    <div id="items-view" style="display:none">
        <button class="btn-small" onclick="backToCats()" style="background:#444; color:#fff; margin-bottom:10px;">BACK</button>
        <div id="items-list"></div>
    </div>
</div>

<div id="cart-tab" class="tab">
    <div class="header-title">CART</div>
    <div id="cart-list"></div>
    <div id="checkout-sec" style="display:none">
        <div class="admin-sec">
            <select id="pay-sel" onchange="showPay(this.value)"><option value="">SELECT PAYMENT</option></select>
            <div id="pay-details" style="display:none;">
                <div class="copy-box" onclick="copyNum(this.innerText)" id="pay-num"></div>
            </div>
            <button class="btn" onclick="confirmOrder()">CONFIRM & REMOVE FROM SHOP</button>
        </div>
    </div>
</div>

<div id="admin-tab" class="tab">
    <div class="header-title">ADMIN</div>
    <div class="admin-sec">
        <select id="adm-cat"><option value="3c/L">3c/L</option><option value="4LL/CC">4LL/CC</option><option value="4C/L Same">4C/L Same</option><option value="4C/L">4C/L</option><option value="Double/Triple">Double/Triple</option></select>
        <textarea id="adm-in" rows="2" placeholder="user:pass:price"></textarea>
        <button class="btn" onclick="doAdm('add_users')">ADD ITEMS</button>
    </div>
    <div class="admin-sec">
        <input id="pay-in" placeholder="Method | Number">
        <button class="btn" onclick="doAdm('add_pay')">ADD PAYMENT</button>
        <div id="adm-pay-list" style="margin-top:10px"></div>
    </div>
    <div class="admin-sec">
        <div id="adm-items-list"></div>
    </div>
</div>

<nav class="nav">
    <div class="nav-item active-nav" onclick="tab('store-tab', this)">STORE</div>
    <div class="nav-item" onclick="tab('cart-tab', this)">CART (<span id="c-count">0</span>)</div>
    <div id="adm-btn" class="nav-item" style="display:none" onclick="tab('admin-tab', this)">ADMIN</div>
</nav>

<script>
    const tg = window.Telegram.WebApp;
    const API = "https://laquita-unperturbed-altagracia.ngrok-free.dev/sma";
    const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3'); // صوت كليك
    let allI = [], allP = [], cart = [];

    if([5939498558].includes(tg.initDataUnsafe.user?.id)) document.getElementById('adm-btn').style.display='block';

    async function load() {
        const r = await fetch(`${API}/get_all`, { headers: {"ngrok-skip-browser-warning":"1"} });
        const d = await r.json(); allI = d.items||[]; allP = d.payments||[];
        renderAdmin(); renderCheckout();
    }

    function tab(id, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
        el.classList.add('active-nav');
        load();
    }

    async function doAdm(action) {
        let content = (action==='add_users')?document.getElementById('adm-in').value:document.getElementById('pay-in').value;
        await fetch(`${API}/admin/manage`, {
            method:'POST', headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
            body:JSON.stringify({user_id:tg.initDataUnsafe.user.id, action, content, cat:document.getElementById('adm-cat').value})
        });
        load();
    }

    async function del(action, val) {
        await fetch(`${API}/admin/manage`, {
            method:'POST', headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'1'},
            body:JSON.stringify({user_id:tg.initDataUnsafe.user.id, action, content:val})
        });
        load();
    }

    function renderAdmin() {
        document.getElementById('adm-pay-list').innerHTML = allP.map(p => `<div class="card"><span>${p}</span><button class="btn-small" style="background:red;color:white" onclick="del('del_pay','${p}')">DEL</button></div>`).join('');
        document.getElementById('adm-items-list').innerHTML = allI.map(i => `<div class="card"><span>@${i.u}</span><button class="btn-small" style="background:red;color:white" onclick="del('del_user','${i.u}')">DEL</button></div>`).join('');
    }

    function addToCart(u, p) {
        if(cart.find(x => x.u === u)) return;
        audio.play();
        cart.push({u, p});
        document.getElementById('c-count').innerText = cart.length;
        renderCart();
        tg.HapticFeedback.impactOccurred('light');
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        if(cart.length === 0) { list.innerHTML = "<p style='text-align:center;'>EMPTY</p>"; document.getElementById('checkout-sec').style.display='none'; return; }
        list.innerHTML = cart.map((i, idx) => `<div class="card"><span>@${i.u} - $${i.p}</span><button class="btn-small" onclick="cart.splice(${idx},1);renderCart();">X</button></div>`).join('');
        document.getElementById('checkout-sec').style.display = 'block';
    }

    async function confirmOrder() {
        for(let item of cart) { await del('del_user', item.u); } // مسح من السيرفر
        tg.showAlert("ORDER CONFIRMED! SEND RECEIPT.");
        cart = []; document.getElementById('c-count').innerText = "0"; renderCart();
        load();
    }

    function renderCheckout() {
        const sel = document.getElementById('pay-sel');
        sel.innerHTML = '<option value="">SELECT PAYMENT</option>' + allP.map((p, i) => `<option value="${i}">${p.split('|')[0]}</option>`).join('');
    }

    function showPay(i) {
        if(i==="") { document.getElementById('pay-details').style.display='none'; return; }
        document.getElementById('pay-details').style.display='block';
        document.getElementById('pay-num').innerText = allP[i].split('|')[1]?.trim() || "NO DATA";
    }

    function copyNum(t) { navigator.clipboard.writeText(t); tg.showAlert("COPIED: " + t); }

    function showCat(c) {
        document.getElementById('cat-menu').style.display='none'; document.getElementById('items-view').style.display='block';
        const fil = allI.filter(i => i.c == c);
        document.getElementById('items-list').innerHTML = fil.map(i => {
            const inCart = cart.find(x => x.u === i.u);
            return `<div class="card"><div><b>@${i.u}</b><br><small>$${i.p}</small></div>
            <button class="btn-small" ${inCart?'disabled':''} onclick="addToCart('${i.u}','${i.p}')">${inCart?'ADDED':'ADD'}</button></div>`;
        }).join('');
    }
    function backToCats() { document.getElementById('cat-menu').style.display='block'; document.getElementById('items-view').style.display='none'; }
    tg.expand(); load();
</script>
</body>
</html>
